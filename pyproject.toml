[project]
name = "finresearch"
version = "0.1.0"
description = "Personal, fact-checked investment research engine (Indian IPOs first) driven by Claude Code with local-model fallback"
authors = [{ name = "Aman4563" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
finresearch = "finresearch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Claude Code CLI / Ollama (skipped unless FINRESEARCH_LIVE=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/finresearch/cli.py" = ["B008"]  # typer declares options as defaults
