[project]
name = "finresearch"
version = "0.18.0"
description = "Personal, fact-checked investment research engine (Indian IPOs first) driven by Claude Code with local-model fallback"
authors = [{ name = "Aman4563" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["investment-research", "ipo", "india", "claude", "mcp", "llm", "fact-checking"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Topic :: Office/Business :: Financial :: Investment",
    "Private :: Do Not Upload",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "mcp>=1.2",
    "markdown-it-py>=3.0",
    "openpyxl>=3.1",
    "xlrd==2.0.2",  # OLE2 .xls only (FBIL pre-2023 G-sec workbooks, NSE fii_stats): BSD-3, pure Python (#366)
    "pypdf>=5.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "casparser>=1.4.1",
    "cryptography>=44",  # AES-256-GCM for the off-machine backup copies (finresearch.backups.crypto)
]

[project.urls]
Repository = "https://github.com/Aman4563/finresearch"
Issues = "https://github.com/Aman4563/finresearch/issues"

[project.scripts]
finresearch = "finresearch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Claude Code CLI / Ollama (skipped unless FINRESEARCH_LIVE=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/finresearch/cli.py" = ["B008"]  # typer declares options as defaults

[tool.pyright]
# Claude Code's pyright-lsp plugin and editors: resolve imports from this checkout's .venv (`uv sync --locked`)
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "scripts"]
typeCheckingMode = "basic"
# the LSP shows Claude every new diagnostic after an edit: keep only signal (ORM Optional attributes and pydantic
# coercions account for most of the rest; tests are left out the same way)
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportArgumentType = false
