# Deterministic checks on every pull request and on pushes to main: lint, format, the offline suite and
# the DB integration tests against a pgvector service. Live Claude/Ollama acceptance runs stay local
# (scripts/smoke_live.py, scripts/smoke_mcp_live.py) because CI has no Max login or local models.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: finresearch_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      FINRESEARCH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/finresearch_test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q   # offline: fake Claude CLI, mocked Ollama/HTTP, real Postgres service
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Run the pinned CLI over the whole history. gitleaks-action scans the push's before..after range, which
      # does not exist on a new repository or after a force push, and needs extra API permissions on PRs.
      - name: Scan the full history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --verbose
