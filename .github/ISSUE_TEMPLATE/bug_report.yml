name: Bug report
description: Something in the engine, tools or app does not work as expected.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Claude Bridge (engines, limits, failover)
        - Documents (download, OCR, sections, search)
        - Data sources (NSE, SEBI, other adapters)
        - fincalc (calculations)
        - MCP tools / claim ledger
        - Research agents / orchestration
        - Report rendering
        - App / API
        - Other
    validations: { required: true }
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `uv run finresearch ...`
        2. ...
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Command output, ledger lines (`data/state/ledger.jsonl`), transcript path, document id + line numbers. Never paste tokens or keys.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or git sha
